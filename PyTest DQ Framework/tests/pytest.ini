[pytest]
python_files = test_*.py
python_functions = test_*
pythonpath = ..
addopts = -ra --strict-markers
markers =
    parquet_data: Data quality checks of aggregated parquet datasets (production DQ run)
    smoke: Lightweight availability checks (dataset readable and not empty)
    example: Framework usage samples, never part of the parquet_data run
    facility_name_min_time_spent_per_visit_date: Checks for facility_name_min_time_spent_per_visit_date dataset
    facility_type_avg_time_spent_per_visit_date: Checks for facility_type_avg_time_spent_per_visit_date dataset
    patient_sum_treatment_cost_per_facility_type: Checks for patient_sum_treatment_cost_per_facility_type dataset
