[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = --html=generated_report/report.html

markers =
    validate_csv: marks tests related to CSV validation
    unmarked: marks tests that do not have explicit marks

# --- Report Portal (pytest-reportportal) ---
# Sending is enabled with the --reportportal flag:
#   pytest --reportportal
# The API key is NOT stored here: set it in the RP_API_KEY environment variable.
rp_endpoint = https://reportportal.epam.com
rp_project = vladyslav_sakhanda_personal
rp_launch = pytest_introduction_csv
rp_launch_description = PyTest Introduction: CSV data validation tests
rp_launch_attributes = homework:report_portal module:pytest_introduction
rp_log_level = INFO
rp_log_batch_size = 20
